    Design:
      properties:
        id:
          description: 'The design hashed id'
          type: string
          example: AS3df3A
          readOnly: true
        name:
          description: 'The design name'
          type: string
          example: Beauty
        design:
          description: 'The design template, split into its parts'
          type: object
          properties:
            includes:
              description: 'The <style> block (CSS) of the design'
              type: string
              example: '<style id="style">...</style>'
            header:
              description: 'The header HTML'
              type: string
            body:
              description: 'The body HTML'
              type: string
            product:
              description: 'The product table HTML'
              type: string
            task:
              description: 'The task table HTML'
              type: string
            footer:
              description: 'The footer HTML'
              type: string
        is_custom:
          description: 'Flag to determine if the design is a custom user design'
          type: boolean
          example: true
        is_active:
          description: 'Flag to determine if the design is available for use'
          type: boolean
          example: true
        is_deleted:
          description: 'Flag to determine if the design is deleted'
          type: boolean
          example: true
        created_at:
          description: Timestamp
          type: number
          format: integer
          example: 134341234234
        updated_at:
          description: Timestamp
          type: number
          format: integer
          example: 134341234234
        deleted_at:
          description: Timestamp
          type: number
          format: integer
          example: 134341234234
      type: object